name: skill_finder
description: "A demo Flutter app for showcasing home and construction service booking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # General standard Dart SDK range

dependencies:
  flutter:
    sdk: flutter

  # Basic icons and UI helpers
  cupertino_icons: ^1.0.8
  
  # For date/time formatting, required by RequestServiceScreen
  intl: ^0.19.0 # Added the required dependency

  # Optional but useful for smoother navigation & UI demos
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # --- ASSET DECLARATION START ---
  # MANDATORY: Add the assets section to reference your local image folder.
  assets:
    - assets/images/
  # --- ASSET DECLARATION END ---